	<body>
		<!-- INICIO NOVO SECTION -->
		<section id="section-novo" class="">
			<div class="container">
				<div class="row">
					<h1 class="col-12 pt-3 bsg">ESCOLHA A LIGA E TIME</h1>
					<div class="col-12 mx-auto">
						<form class="form-group" action="/finish" method="post">
							<script>
								function show(aval) {
									if (aval.value == "Orange") {
										document.getElementById("hiddenDiv1").style.displayd='inline-block';
										// Form.fileURL.focus();
									} 
									else if (aval == "Bananna") {
										document.getElementById("hiddenDiv2").style.displayd='inline-block';
									} 
									else{
										hiddenDiv1.style.display='none';
										hiddenDiv2.style.display='none';
									}
								}
							</script>
							<div class="form-group pb-2">
								<label>Pick a fruit:</label>
								<select class="form-control " name="Fruit" onchange="show(this)">
									<option value="Apple">Apple</option>
									<option value="Orange">Orange</option>
									<option value="Bananna">Bananna</option>
								</select>
							</div>
							<div class="form-group pb-2">
								<label>Hidden 2nd Question about Oranges</label>
								<select id="hiddenDiv1" class="form-control " name="Orange_question" style="display:none">
									<option value="Yes">Yes</option>
									<option value="No" selected>Yes</option>
								</select>
								<select id="hiddenDiv2" class="form-control " name="Orange_question" style="display:none">
									<option value="Yes">No</option>
									<option value="No" selected>No</option>
								</select>
							</div>

							<div class="form-group pb-2">
								<label for="league" >Jogar na Liga: </label>
								<select class="form-control col-md-6 col-12" id="league" onchange="java_script_:show(this.options[this.selectedIndex].value)">
									<option value="0" >Selecione a Liga</option>
									{loop="$leagues"}
										{loop="$value"}
											<option value="{$value1.$counter.idleague}" >
												{$value1.$counter.desinitials}
											</option>
										{/loop}
									{/loop}
								</select>
								<small class="form-text">
									<p class="mb-0">Exibindo apenas as Ligas selecionadas anteriormente!</p>
								</small>
							</div>

							<div class="form-group pb-2">
								<label for="team" >Selecione o time</label>
								<select id="team" class="form-control col-md-6 col-12" >
									<option value="" selected >Selecione a Liga primeiro</option>
								</select>
								{loop="$teams"}
									<select id="sist-{$counter+1}" class="form-control col-md-6 col-12" style="display:none">
										{loop="$value"}
											<option value="{$value1.$counter.idteam}" >
												{$value1.$counter.desdname} - 
												{$value1.$counter.desname|utf8_encode}
											</option>
										{/loop}
									</select>
								{/loop}
							</div>
							<script>
								// function show(aval) {

							</script>

							<div class="btn-group float-right" role="group" aria-label="">
								<a role="button" class="btn btn-secondary" href="/new" >Voltar</a>
								<button type="submit" class="btn btn-info" >Continuar</button>
							</div>
						</form>
					</div>
