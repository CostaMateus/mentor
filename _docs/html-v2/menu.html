			.bsg h1 { font-size: 5rem; }
			.bsg h3 { font-size: 2rem; }

			 body {
				background-image: url("/res/site/assets/images/logo/LoLSreen.png");
				background-repeat: no-repeat;
				background-position: top center;
				background-attachment: fixed;
				background-size: cover;
			}

			#section-menu, #section-footer {

			}

	<body>
		<!-- INICIO MENU SECTION -->
		<section id="section-menu" class="section">
			<div class="container">
				<div class="row">
					<div class="col-12 text-center bsg">
						<h1>THE COACH</h1> 
						<h3>be the best</h3> 
					</div>
					<div class="col-md-4 col-8 mx-auto text-center card bg-light">
						<a class="btn btn-info mt-3 mb-2" 		href="/new1">Novo jogo</a>
						<a class="btn btn-info my-2" 			href="/home">Continuar jogo</a>
						<a class="btn btn-info disabled my-2" 	href="#" disabled >Editor de equipes</a>

				</div>
			</div>
		</section>
		<!-- FINAL MENU SECTION -->


		<!-- INICIO MODALS SECTION -->
		<section id="section-modals" class="section">
			<!-- Logout modal start -->
			<div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="logoutModalTitle" aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered" role="document">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title" id="logoutModalTitle">Logout</h5>
							<button type="button" class="close" data-dismiss="modal" aria-label="Close">
								<span aria-hidden="true">&times;</span>
							</button>
						</div>
						<div class="modal-body text-center">
							<i class="fas fa-exclamation-circle fa-lg" style="color: #F0AD4E;"></i> 
							Deseja realmente sair?
						</div>
						<div class="modal-footer">
							<a href="/logout" class="btn btn-light">Sair</a>
							<button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
						</div>
					</div>
				</div>
			</div>
			<!-- Logout modal end -->
		</section>
